name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Vet and Test
    runs-on: ubuntu-latest

    steps:

      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
        id: go

      - name: Get dependencies
        run: |
         go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...

      - name: Test Race Conditions
        run: go test -cover -race -v ./...
