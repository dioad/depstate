version: "2"

linters:
  default: all
  disable:
    - inamedparam
    - gochecknoinits
    - wsl
    - wsl_v5
    - whitespace
    - wrapcheck
    - exhaustruct
    - exhaustruct_v5
    - err113
    - nlreturn
    - testpackage
    - depguard
    - paralleltest
    - varnamelen
    - forbidigo
    - funlen
    - gochecknoglobals
    - godox
    - lll
    - mnd
    - noinlineerr
    # funcorder demands constructor-then-exported-then-unexported ordering,
    # which conflicts with this codebase's existing, deliberate convention
    # of placing an unexported helper immediately after the exported method
    # that calls it (e.g. dependencyState.WaitForAny / firstMetDependency,
    # and SubscribeTo / cleanupSubscription in dependency_state.go) -
    # readability here comes from proximity to the call site, not from
    # export-status grouping. Pure code-organization preference, no
    # correctness value; consistent with the other style linters already
    # disabled above.
    - funcorder
  settings:
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        # Generic functions/constructors that return a type parameter, or
        # an interface instantiated with one (e.g. NewDependencyState
        # returning DependencyState[T]), aren't the "unnecessary interface"
        # smell ireturn looks for.
        - generic
        # pubsub.Topic (github.com/dioad/pubsub) is a sibling module's
        # interface with several unexported concrete implementations
        # (plain, with history, lock-free history). This package's own
        # test helpers (setupTest in test_helpers.go, setupBenchmark in
        # benchmark_test.go) return it because there is no exported
        # concrete type to return instead.
        - pubsub\.Topic$
  exclusions:
    rules:
      # Concurrency tests in this package (TestConcurrentAccess,
      # TestRaceCondition, TestContextCancellation in
      # dependency_state_race_test.go) necessarily spawn several goroutines
      # and branch over select/range loops to exercise real race
      # conditions; that drives up cognitive/nesting "complexity" scores
      # without the test itself being hard to follow. funlen is disabled
      # repo-wide for the same reason.
      - path: '_test\.go'
        linters:
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
          - nestif
      # Repeated literals in tests are almost always fixture/expectation
      # data (a dependency ID like "service1", a state string like
      # "Happy"/"Sad") reused across otherwise-independent test functions,
      # not a shared business constant that drifted. Forcing every one
      # into a package-level const would couple unrelated tests together
      # for no benefit.
      - path: '_test\.go'
        linters:
          - goconst

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
